<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My first html page</title>
</head>
<body>
    <!-- This is a comment -->
    <p>revising html</p>  <!--<p></p> is paragraph tag used for paragraph -->
     <h1>Heading1</h1> <!-- <h1></h1> is heading tag used for main heading -->
    <h2>Heading2</h2>
    <h3>Heading3</h3>
    <h4>Heading4</h4>
    <h5>Heading5</h5>
    <h6>Heading6</h6>
    <hr>

    <a href="https://www.google.com">Google</a> <!-- <a></a> is anchor tag used for linking /absolute link-->
    <br> <!-- <br> is line break tag used for line break -->
    <a href="/portfolio/index.html">portfolio</a><!-- <a></a> is anchor tag used for linking /relative link-->
        <br>
    <img src="abc.jpg" alt="abc"
    alt="nothing"> <!-- <img> is image tag used for displaying images --//alt is used for alternative text if image is not found -->
    <hr>

    <b>Bold</b> <!-- <b></b> is bold tag used for making text bold -->
    <br>
    <i>Italic</i> <!-- <i></i> is italic tag used for making text italic -->
    <br>
    <u>Underline</u> <!-- <u></u> is underline tag used for making text underline -->
    <br>
    <ol> <!-- <ol></ol> is ordered list tag used for making ordered list    -->
        <li>item1</li> <!-- <li></li> is list item tag used for making list items -->
        <li>item2</li>
        <li>item3</li>
        <br>
        <big>Big Text</big><!-- <big></big> is big tag used for making text big -->
        <br>
        <small>Small Text</small><!-- <small></small> is small tag used for making text small -->
        <br>
        <hr> <!-- <hr> is horizontal rule tag used for making horizontal line -->
  

    
</body>
</html>
